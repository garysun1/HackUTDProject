<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shift Memory</title>
<meta name="description" content="Live operational memory of the floor: events, assets, alerts, and the shift handoff, every claim backed by a photo." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-DwuwiZSb.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CzxIMowl.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Shift Memory</h1><span class="db" id="db"></span></div>
  <div class="status" id="conn" data-state="connecting"><span class="dot"></span><span id="conn-text">connecting</span></div>
  <div class="filters">
    <label class="sel">Window <select id="window"><option value="all">all time</option><option value="720">this shift (12 h)</option><option value="60">last 60 min</option><option value="180">last 3 h</option><option value="480">last 8 h</option></select></label>
    <div class="chips" id="wearers" aria-label="Wearers"></div>
  </div>
</header>
<main class="grid">
  <div class="stale" id="stale" role="status"></div>
  <section class="col timeline" aria-label="Timeline">
    <div class="colhead"><h2>Timeline</h2><span class="count" id="count">0 events</span><button class="btn ghost icon" id="tl-toggle" type="button" aria-expanded="true" aria-controls="timeline" title="Hide timeline"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M7 7v6"/></svg></button></div>
    <ol id="timeline" class="events"></ol>
    <p class="empty" id="timeline-empty">No events yet. The first photo from the floor will appear here.</p>
  </section>
  <section class="col floor" aria-label="Memory graph">
    <div class="colhead"><h2>Memory</h2><span id="floor-tools" class="floor-tools"></span><span class="legend"><i class="k k-ph"></i>photo <i class="k k-pl"></i>place <i class="k k-as"></i>asset <i class="k k-chg"></i>change <i class="k k-al"></i>alert</span></div>
    <div id="map" class="map" hidden aria-label="Site map: where each wearer walked, where each photo was taken, where the problems are"></div>
    <div id="map-unplaced" class="map-unplaced" hidden></div>
    <div id="scope-head" class="scope-head" hidden><span id="scope-title"></span><button class="btn ghost" id="scope-close" type="button" aria-label="Close">Close</button></div>
    <canvas id="floor" role="img" aria-label="Memory graph: photos as nodes, the places, assets and objects seen in them as nodes stemming outward, lines as relationships. The timeline lists the same photos."></canvas>
    <p class="empty" id="floor-empty">The graph draws itself from photos as they arrive.</p>
    <section class="drawer" id="drawer" hidden role="dialog" aria-labelledby="drawer-title">
      <div class="colhead"><h2 id="drawer-title">Event</h2><button class="btn ghost" id="drawer-close" type="button" aria-label="Close">Close</button></div>
      <img id="drawer-img" alt="Photo taken by the wearer at this event" />
      <dl id="drawer-fields" class="fields"></dl>
    </section>
  </section>
</main>
</body>
</html>
