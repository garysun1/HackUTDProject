<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reflection</title>
<meta name="description" content="Live operational memory of the floor: the site in 3D, events, equipment, issues, and the shift handoff, every claim backed by a photo." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-0caulKDi.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CbgyUwQY.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Reflection</h1>
    <span class="sel ws-label" id="ws-label">Workspace</span><div class="ws"><button class="ws-btn" aria-labelledby="ws-label ws-name" id="ws-btn" type="button" aria-haspopup="menu" aria-expanded="false"><span class="ws-name" id="ws-name">Workspace</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
      <div class="ws-menu" id="ws-menu" role="menu" hidden></div></div>
    <span class="db" id="db" hidden></span></div>
</header>
<main class="grid">
  <div class="stale" id="stale" role="status"></div>
  <section class="col floor" aria-label="Memory graph">
    <div class="colhead"><h2>Shift</h2><span id="floor-tools" class="floor-tools"></span><span class="legend"><i class="k k-ph"></i>photo <i class="k k-as"></i>equipment <i class="k k-al"></i>issue <i class="k k-chg"></i>change <i class="k k-nt"></i>note</span></div>
    <div class="chips map-wearers" id="wearers" role="group" aria-label="Wearers: click to show or hide"></div>
    <div id="map" class="map" hidden aria-label="3D site view: the building, where each wearer walked, where each photo was taken, where the problems are"></div>
    <div id="scope-head" class="scope-head" hidden><span id="scope-title"></span><button class="btn ghost" id="scope-close" type="button" aria-label="Close">Close</button></div>
    <canvas id="floor" role="img" aria-label="The shift: photos in time order on a line; equipment and issues above, threading to the photos they appear in; the wearer's notes below; changes as arcs from before to after."></canvas>
    <p class="empty" id="floor-empty">The shift draws itself from photos as they arrive.</p>
    <section class="drawer" id="drawer" hidden role="dialog" aria-labelledby="drawer-title">
      <div class="colhead"><h2 id="drawer-title">Event</h2><button class="btn ghost" id="drawer-close" type="button" aria-label="Close">Close</button></div>
      <img id="drawer-img" alt="Photo taken by the wearer at this event" />
      <dl id="drawer-fields" class="fields"></dl>
    </section>
  </section>
</main>
</body>
